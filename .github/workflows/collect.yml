# Collect Apple's prices and publish them.
#
# This used to be a Cloudflare cron. It never once completed a pass: parsing a
# store page costs about 1.8ms of cold CPU, a full sweep needs some five
# CPU-seconds, and a free plan's scheduled worker can spend 4.8 in an entire
# day -- so every tick was killed mid-step, which left the cursor unwritten and
# the sweep retrying the same step forever.
#
# A runner has no such ceiling. The same scraper, unchanged, walks the whole
# catalogue in one go.
name: Collect prices

on:
  schedule:
    # Early morning UTC, when Apple's stores are least likely to be mid-update.
    - cron: '0 4 * * *'
  workflow_dispatch:

# A second run would race the first over the same KV keys and D1 rows.
concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --no-install throughout: a runner that has to fetch jiti at run time is
      # a runner whose lockfile no longer covers the pipeline, and that should
      # fail here rather than quietly pull a different version.

      # Prices first: the refurbished read appends to the same snapshot file.
      - name: Collect list prices
        run: npx --no-install jiti scripts/collect.ts

      - name: Collect refurbished listings
        run: npx --no-install jiti scripts/collect-refurb.ts

      - name: Publish to KV and D1
        run: npx --no-install jiti scripts/publish.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A failed run publishes nothing, so the site keeps serving the last good
      # snapshot. Keep the collection anyway -- it is how you tell a scraper
      # that broke from a store that changed.
      - name: Keep the collection for inspection
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot
          path: data/snapshot.json
          retention-days: 7

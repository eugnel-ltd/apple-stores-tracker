name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-sdlc-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Select and run decisive evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select evidence route
        id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/sdlc/route.mjs --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Check exact introduced diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            git show --check --format= "$HEAD_SHA"
          else
            echo "comparison base is unavailable" >&2
            exit 1
          fi

      - name: Validate AI-SDLC governance contract
        run: npm run check:governance

      - name: Set up product Node runtime
        if: steps.route.outputs.scope == 'full'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        if: steps.route.outputs.scope == 'full'
        run: npm ci

      - name: Run deterministic product tests
        if: steps.route.outputs.scope == 'full'
        run: npm test

      - name: Compile and build production bundle
        if: steps.route.outputs.scope == 'full'
        run: npm run build

      - name: Record route
        if: always()
        env:
          SCOPE: ${{ steps.route.outputs.scope }}
          REASON: ${{ steps.route.outputs.reason }}
        run: |
          {
            echo "## AI-SDLC evidence route"
            echo
            echo "- Scope: \`${SCOPE:-full}\`"
            echo "- Reason: \`${REASON:-comparison-unavailable}\`"
            echo "- Governance contract: always selected"
            echo "- Product tests/build: selected only for \`full\`"
          } >> "$GITHUB_STEP_SUMMARY"

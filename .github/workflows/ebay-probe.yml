# Check eBay's Browse API still answers the way the parser expects.
#
# Manual only, and it writes nothing: the second-hand data it reads never
# reaches KV, D1 or the site. It exists because `src/scrape/ebay.ts` is written
# against a published response example, and an example is not a contract.
name: Probe eBay

on:
  workflow_dispatch:
    inputs:
      query:
        description: What to search for
        required: false
        default: Apple MacBook Pro M4

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - shell: bash
        run: |
          query_pattern='^[[:alnum:] .,+/()-]*$'
          if [[ ! "$EBAY_QUERY" =~ $query_pattern ]]; then
            echo 'Query contains unsupported characters; use letters, numbers, spaces or .,+/()-' >&2
            exit 1
          fi
          npx --no-install jiti scripts/probe-ebay.ts "$EBAY_QUERY"
        env:
          EBAY_QUERY: ${{ inputs.query }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
